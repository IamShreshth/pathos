name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B cpp-engine/build -S cpp-engine -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build cpp-engine/build --config Release

